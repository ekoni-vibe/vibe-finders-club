name: Daily Agentic Real Estate Pipeline Workflow

on:
  schedule:
    # Runs at 06:00 UTC (1:00 AM EST) every day
    - cron: '0 6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  run-agentic-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime (Zero-Cost Environment)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          if [ -f package.json ]; then npm install; else echo "No extra packages required. Using standard Node.js libraries."; fi

      - name: Execute Daily Copilot Pipeline Agent
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_WEBHOOK_URL: ${{ secrets.TELEGRAM_WEBHOOK_URL }}
          GENERAL_WEBHOOK_URL: ${{ secrets.GENERAL_WEBHOOK_URL }}
        run: node pipeline-agent.js

      - name: Upload Triage Execution Log Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: daily-triage-execution-log
          path: ./triage-execution-log.json
          retention-days: 7