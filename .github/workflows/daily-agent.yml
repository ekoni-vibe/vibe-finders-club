name: Daily Agentic Real Estate Pipeline Workflow

on:
  schedule:
    # Runs at 06:00 UTC (1:00 AM EST) every day
    - cron: '0 6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  run-agentic-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime (Zero-Cost Environment)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Scrape Property Sources
        env:
          HUD_SEIZED_PROPERTIES_URL: ${{ secrets.HUD_SEIZED_PROPERTIES_URL }}
          FANNIE_MAE_REO_URL: ${{ secrets.FANNIE_MAE_REO_URL }}
          COUNTY_TAX_DEED_URLS: ${{ secrets.COUNTY_TAX_DEED_URLS }}
        run: node pipeline-agent.js --scrape

      - name: Commit Updated Triage Log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add triage-execution-log.json
          if git diff --cached --quiet; then
            echo "No new listings to commit."
          else
            git commit -m "Update daily property scrape results"
            git push
          fi

      - name: Upload Triage Execution Log Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: daily-triage-execution-log
          path: ./triage-execution-log.json
          retention-days: 7